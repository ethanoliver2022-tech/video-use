# Copy to config.yaml and tune. Secrets go in .env, not here.
#
# Pick a preset, then override only what you want. Anything set below wins over the preset.
#   degen    — instant snipes, loose filters, wide stops, let winners run
#   balanced — the defaults
#   safe     — 6s early-flow confirmation, strict filters, tight stops, quick profits
preset: balanced

trading:
  buy_amount_sol: 0.05          # per snipe (changeable live from Telegram: /setbuy)
  max_open_positions: 3
  slippage_pct: 20
  priority_fee_sol: 0.0005      # only used when speed.auto_priority_fee is false
  min_sol_reserve: 0.03         # always keep this for sell fees + rent
  daily_loss_limit_sol: 0.5     # stops new entries for the rest of the UTC day (0 = no limit)
  cooldown_after_loss_seconds: 60  # no new entries for this long after a losing trade (0 = off)

speed:
  jito_enabled: true            # swap + tip as one bundle: MEV/sandwich protection + priority
  jito_tip_sol: 0.0005
  jito_block_engines:           # sent to every region at once (fastest landing)
    - https://ny.mainnet.block-engine.jito.wtf
    - https://amsterdam.mainnet.block-engine.jito.wtf
    - https://frankfurt.mainnet.block-engine.jito.wtf
    - https://tokyo.mainnet.block-engine.jito.wtf
    - https://slc.mainnet.block-engine.jito.wtf
  jito_also_send_rpc: false     # true = lands more often, but loses sandwich protection
  broadcast_rpcs: []            # extra RPC URLs to fan every transaction out to
  auto_priority_fee: true
  priority_fee_percentile: 75
  min_priority_fee_sol: 0.0001
  max_priority_fee_sol: 0.003

discovery:
  pumpfun_new_tokens: true
  pumpfun_migrations: false
  geckoterminal_networks: [solana, base, bsc, eth]   # non-Solana = alerts only
  dexscreener_profiles: true
  geckoterminal_poll_seconds: 20
  dexscreener_poll_seconds: 30
  max_candidate_age_seconds: 1800   # ignore pools / launches older than this
  auto_snipe: all               # all | targeted (dev watchlist + keywords only) | off
  snipe_keywords: []            # e.g. [trump, pepe] matched in name / ticker
  dev_watchlist: []             # dev wallets whose next pump.fun launch to buy instantly
  dev_snipe_sol: 0              # size for watched-dev snipes (0 = buy_amount_sol)
  dev_snipe_skip_filters: true
  # Momentum scanner: Solana tokens pumping right now (free GeckoTerminal + DexScreener data,
  # ~10-30s behind the chain). Switch on/off any time from Telegram's main menu (🚀 Momentum).
  momentum_enabled: false
  momentum_action: alert          # alert = just tell me | buy = also buy (filters still apply)
  momentum_poll_seconds: 30
  momentum_min_change_5m_pct: 25  # price up at least this much in the last 5 minutes
  momentum_min_volume_5m_usd: 10000
  momentum_min_buyers_5m: 25
  momentum_min_buy_ratio: 1.5     # buys at least this many times sells
  momentum_min_liquidity_usd: 10000
  momentum_buy_sol: 0             # buy size in buy mode (0 = buy_amount_sol)
  momentum_alerts_per_hour: 20
  momentum_repeat_minutes: 120    # don't signal the same token again for this long

copytrade:                      # needs PUMPPORTAL_API_KEY in .env
  enabled: false
  min_leader_buy_sol: 0.2
  run_safety_checks: true
  wallets: []
  #  - {address: <wallet>, label: whale1, buy_sol: 0.1, copy_sells: true}
  # You can also add/remove wallets live from Telegram: /copy add <wallet> [label] [sol]

notify:
  telegram: false               # needs TELEGRAM_BOT_TOKEN + TELEGRAM_CHAT_ID in .env
  telegram_control: true        # commands + sell buttons from your chat
  alert_other_chains: true     # Base/BSC/ETH launches that pass filters (max 20 per hour)

endpoints:
  # Public RPC is too slow for live trading: set SOLANA_RPC_URL in .env to a paid one.
  rpc_url: https://api.mainnet-beta.solana.com
  jupiter_api: https://lite-api.jup.ag/swap/v1
  ipfs_gateway: ""              # e.g. a dedicated Pinata gateway for faster metadata

data_dir: data

